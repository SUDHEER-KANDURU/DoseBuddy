# Test/Development Configuration
# Embedded H2 database for testing
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Override the base (MySQL) dialect so the embedded H2 database generates and
# accepts H2-compatible DDL under the test profile. Without this the base
# application.properties forces MySQLDialect against H2 and the schema is never
# created ("Table USERS not found").
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Test JWT secret
jwt.secret=test_jwt_secret_key_minimum_32_characters_long_for_testing

# Mock AI service keys (will handle gracefully)
GROQ_API_KEY=test_key
GEMINI_API_KEY=test_key

server.port=8080