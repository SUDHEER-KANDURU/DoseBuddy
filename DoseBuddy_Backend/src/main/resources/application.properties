spring.datasource.url=${DB_URL}

spring.datasource.username=${DB_USER}

spring.datasource.password=${DB_PASS}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=${PORT:8080}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

groq.model=llama-3.3-70b-versatile
groq.base.url=https://api.groq.com/openai/v1/chat/completions
groq.api.key=${GROQ_API_KEY:}

gemini.model=gemini-2.0-flash

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

# ── SMTP Email Configuration ──────────────────────────────────────────────────
# JavaMailSender is configured programmatically in MailConfig.java which reads
# MAIL_HOST / MAIL_PORT / MAIL_USERNAME / MAIL_PASSWORD directly from environment.
# Spring Boot's MailSenderAutoConfiguration is excluded in DosebuddyApplication.java.
# Set MAIL_PORT=465 in Render (SMTPS/SSL, bypasses Render's port-587 block).

app.mail.from=${MAIL_FROM:${MAIL_USERNAME:noreply@dosebuddy.com}}
app.mail.from-name=DoseBuddy
