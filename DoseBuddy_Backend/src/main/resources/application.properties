spring.datasource.url=${DB_URL}

spring.datasource.username=${DB_USER}

spring.datasource.password=${DB_PASS}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=${PORT:8080}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

groq.model=llama-3.3-70b-versatile
groq.base.url=https://api.groq.com/openai/v1/chat/completions
# Bridge: resolves GROQ_API_KEY env var through Spring's property chain.
# Works on Railway (env var), locally (application-local.properties sets GROQ_API_KEY),
# and via -D system property. Empty default = feature disabled if not set.
groq.api.key=${GROQ_API_KEY:}

gemini.model=gemini-2.0-flash

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000
