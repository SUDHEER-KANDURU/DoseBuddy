spring.datasource.url=${DB_URL}

spring.datasource.username=${DB_USER}

spring.datasource.password=${DB_PASS}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=${PORT:8080}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

groq.model=llama-3.3-70b-versatile
groq.base.url=https://api.groq.com/openai/v1/chat/completions
groq.api.key=${GROQ_API_KEY:}

gemini.model=gemini-2.0-flash

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

# ── Email Configuration (Resend HTTP API) ────────────────────────────────────
# Resend is used instead of SMTP because Render free tier blocks outbound SMTP ports.
# Sign up at https://resend.com — free tier: 3 000 emails/month, 100/day.
# 1. Get your API key at https://resend.com/api-keys → set RESEND_API_KEY in Render.
# 2. Set MAIL_FROM to your verified sender, e.g. "DoseBuddy <you@yourdomain.com>"
#    or use "DoseBuddy <onboarding@resend.dev>" for quick testing.
resend.api.key=${RESEND_API_KEY:}

app.mail.from=${MAIL_FROM:DoseBuddy <onboarding@resend.dev>}
app.mail.from-name=DoseBuddy
